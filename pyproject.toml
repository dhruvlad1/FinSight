[project]
name = "finsight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhruv", email = "laddhruv495@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "groq>=1.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
]

[project.scripts]
finsight = "finsight:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
